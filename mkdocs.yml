site_name: ROBOMASTER レポート
site_url: https://nico-tech-shenzhen.github.io/robomaster-report/
theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nico-Tech-Shenzhen
plugins:
  - search
  - with-pdf:
      author: Scramble
      cover_title: ROBOMASTER レポート
      cover_subtitle: 中国ロボット競技のエコシステム、技術、政策を深掘りする
      cover_title: RoboMaster 完全研究レポート
      cover_subtitle: 中国ロボット競技のエコシステム、技術、政策を深掘りする
      enabled_if_env: ENABLE_PDF_EXPORT
      output_path: pdf/robomaster-report.pdf
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
nav:
  - ホーム: index.md
  - 第1章　概要: ch01.md
  - 第2章　オープンソースエコシステムとルール: ch02.md
  - 第3章　DJIの戦略と人材エコシステム: ch03.md
  - 第4章　技術進化と産業還流: ch04.md
  - 第5章　歴史と進化: ch05.md
  - 第6章　参加者プロフィールとチーム運営: ch06.md
  - 第7章　教育インパクトとキャリアパス: ch07.md
  - 第8章　スタートアップと産業エコシステム: ch08.md
  - 付録: appendix.md
