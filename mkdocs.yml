site_name: RoboMaster 2026 Research Report
site_url: https://nico-tech-shenzhen.github.io/robomaster-report/
theme:
  name: material
  language: ja
  features: [navigation.sections, navigation.expand, search.highlight, content.code.copy]
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - はじめに: index.md
  - 第1章　RoboMaster 2026の現場: 01-competition-2026.md
  - 第2章　規則を設計入力に変える: 02-rules-as-engineering.md
  - 第3章　2026年の機体とソフトウェア: 03-machines-2026.md
  - 第4章　設計資産が次のシーズンへ残る仕組み: 04-knowledge-system.md
  - 第5章　一年でロボット群を作る組織: 05-team-year.md
  - 第6章　人材・産業・DJIの接点: 06-people-industry-dji.md
  - 第7章　大学・制度・他競技との違い: 07-institutions-comparison.md
  - 第8章　日本で再現するための条件: 08-lessons-for-japan.md
  - 付録: appendix.md
