site_name: RoboMaster 2026 Research Report
site_url: https://nico-tech-shenzhen.github.io/robomaster-report/
exclude_docs: |
  includes/
theme:
  name: material
  language: ja
  features: [navigation.sections, navigation.expand, search.highlight, content.code.copy]
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - はじめに: index.md
  - 第1章　RoboMaster 2026の現場: ch01.md
  - 第2章　2026年のロボットと技術: ch02.md
  - 第3章　ルール変更と技術開発の変化: ch03.md
  - 第4章　オープンソースと技術移転: ch04.md
  - 第5章　チーム運営と大学教育・研究: ch05.md
  - 第6章　人材・スタートアップとロボット産業: ch06.md
  - 第7章 DJIが提供する競技基盤: ch07.md
  - 第8章 RoboMasterの制度化と社会的位置づけ: ch08.md
  - 第9章　中国国内の競技比較: ch09.md
  - 付録: appendix.md
