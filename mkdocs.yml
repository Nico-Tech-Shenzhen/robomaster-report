site_name: RoboMaster 2026 Research Report
site_url: https://nico-tech-shenzhen.github.io/robomaster-report/
exclude_docs: |
  includes/
theme:
  name: material
  language: ja
  features: [navigation.sections, navigation.expand, search.highlight, content.code.copy]
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - はじめに: index.md
  - 第1章　RoboMaster 2026の現場: ch01.md
  - 第2章　2026年のロボットと技術: ch02.md
  - 第3章　ルール変更と技術開発の変化: ch03.md
  - 第4章　設計資産が残る仕組み: ch04.md
  - 第5章　学年・登録区分・年間運営: ch05.md
  - 第6章　調達・スポンサー・人材: ch06.md
  - 第7章　DJIと競技用ハードウェア: ch07.md
  - 第8章　政府・制度・政策: ch08.md
  - 第9章　中国国内の競技比較: ch09.md
  - 付録: appendix.md
